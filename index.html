<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>気分記録アプリ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">

  <style>
    .body {

  font-family: 'Noto Sans JP', sans-serif;

  text-align: center;

  padding: 10px;

  margin: auto;

  max-width: 100vw;

  overflow-x: hidden;
}
  
    h1 {
      margin-bottom: 20px;
    }

    .calendar {

  display: grid;

  grid-template-columns: repeat(7, 1fr);

  gap: 5px;

  margin-top: 10px;

  width: 100%;

  box-sizing: border-box;
}

.colors {

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 12px;

  margin-top: 30px;

  margin-bottom: 40px;

  width: 100%;

  flex-wrap: wrap;
}

    .weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);

  margin-bottom: 10px;

  text-align: center;

  font-weight: bold;
}
.weekdays div {
  padding: 5px;
}

   .day {

  border: 1px solid #ccc;

  border-radius: 10px;

  background: white;

  aspect-ratio: 1 / 1;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: space-between;

  padding-top: 5px;

  position: relative;

  box-sizing: border-box;

  padding-bottom: 8px;
}

    .color-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }

    .color1 { background: #ffe5e5; }
    .color2 { background: #ffb3b3; }
    .color3 { background: #ff8080; }
    .color4 { background: #ff4d4d; }
    .color5 { background: #ff1a1a; }

    .header {
   display: flex;
   justify-content: center;
   align-items: center;
   gap: 20px;
   margin-bottom: 20px;
  }

.header button {
  padding: 10px 15px;
  font-size: 18px;
  cursor: pointer;
}

  </style>
</head>

<body>

  <div class="header">
  <button onclick="changeMonth(-1)">←</button>

  <h1 id="monthTitle"></h1>

  <button onclick="changeMonth(1)">→</button>
</div>

<div class="weekdays">
  <div>日</div>
  <div>月</div>
  <div>火</div>
  <div>水</div>
  <div>木</div>
  <div>金</div>
  <div>土</div>
</div>

  <div class="calendar" id="calendar"></div>

  <div class="buttons">
    <button class="color-btn color1"
onclick="selectColor('#ffe5e5', 5)">
</button>

<button class="color-btn color2"
onclick="selectColor('#ffb3b3', 4)">
</button>

<button class="color-btn color3"
onclick="selectColor('#ff8080', 3)">
</button>

<button class="color-btn color4"
onclick="selectColor('##ff4d4d', 2)">
</button>

<button class="color-btn color5"
onclick="selectColor('#ff1a1a', 1)">
</button>
  </div>

  <br><br>

<script>

const calendar = document.getElementById("calendar");
const monthTitle = document.getElementById("monthTitle");

let selectedColor = "#ffe5e5";
let selectedValue = 5;

function selectColor(color, value) {
  selectedColor = color;
  selectedValue = value;
}

const today = new Date();

let currentYear = today.getFullYear();
let currentMonth = today.getMonth();

function getMonthKey(year, month) {
  return `${year}-${month}`;
}

function renderCalendar() {

  calendar.innerHTML = "";

  monthTitle.innerText =
    `${currentYear}年 ${currentMonth + 1}月`;

  const daysInMonth =
    new Date(currentYear, currentMonth + 1, 0).getDate();

  const firstDay =
    new Date(currentYear, currentMonth, 1).getDay();

  for (let j = 0; j < firstDay; j++) {

    const empty = document.createElement("div");

    calendar.appendChild(empty);
  }

  const monthKey =
    getMonthKey(currentYear, currentMonth);

  const savedData =
    JSON.parse(localStorage.getItem(monthKey)) || {};

  for (let i = 1; i <= daysInMonth; i++) {

    const day = document.createElement("div");

    day.className = "day";

    const dateText =
      document.createElement("div");

    dateText.innerText = i;

    day.appendChild(dateText);

    if (savedData[i]) {

      const sticker =
        document.createElement("div");

      sticker.style.width = "24px";
      sticker.style.height = "24px";

      sticker.style.borderRadius = "50%";

      sticker.style.backgroundColor =
        savedData[i].color;

      sticker.style.marginTop = "5px";

      sticker.style.alignSelf = "center";

      day.appendChild(sticker);
    }

    day.onclick = () => {
    const targetDate = new Date();

targetDate.setDate(targetDate.getDate() - 1);

const isTargetDate =

  i === targetDate.getDate() &&

  currentMonth === targetDate.getMonth() &&

  currentYear === targetDate.getFullYear();

if (!isTargetDate) {

  alert("前日の日付だけ入力できます");

  return;
}

      if (savedData[i]) {
        return;
      }

      const sticker =
        document.createElement("div");

      sticker.style.width = "24px";
      sticker.style.height = "24px";

      sticker.style.borderRadius = "50%";

      sticker.style.backgroundColor =
        selectedColor;

      sticker.style.marginTop = "5px";

      sticker.style.alignSelf = "center";

      day.appendChild(sticker);

      savedData[i] = {
        color: selectedColor,
        value: selectedValue
      };

      localStorage.setItem(
        monthKey,
        JSON.stringify(savedData)
      );
    };

    calendar.appendChild(day);
  }
}

function changeMonth(direction) {

  currentMonth += direction;

  if (currentMonth < 0) {
    currentMonth = 11;
    currentYear--;
  }

  if (currentMonth > 11) {
    currentMonth = 0;
    currentYear++;
  }

  renderCalendar();
}

function downloadCSV() {

  let csv = "日付,値\n";

  for (let key in localStorage) {

    if (!key.includes("-")) continue;

    const monthData =
      JSON.parse(localStorage.getItem(key));

    const [year, month] = key.split("-");

    for (let day in monthData) {

      const value =
        monthData[day].value;

      const date =
        `${year}-${Number(month)+1}-${day}`;

      csv += `${date},${value}\n`;
    }
  }

  const blob =
    new Blob([csv], { type: "text/csv" });

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download = "mood_data.csv";

  a.click();

  URL.revokeObjectURL(url);
}

renderCalendar();

</script>
</body>
</html>
