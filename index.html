<!DOCTYPE html>
<html lang="ja">
  <div id="styleSelector">

  <h2>
    使用するカレンダーを<br>
    選択してください(3種類)
  </h2>

  <p>
    ※選択後は変更できません
  </p>

    </div>

    <div class="styleOption"
         onclick="selectStyle('corner')">

      <span>左角</span>

    </div>

  </div>

</div>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <!-- iPhoneでアプリっぽくする -->

        content="yes">

  <meta name="apple-mobile-web-app-status-bar-style"
        content="default">

  <!-- アイコン -->
  <link rel="apple-touch-icon"
        href="icon.png">

  <title>今日のきろく</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">

  <style>
    .body {

  font-family: 'Noto Sans JP', sans-serif;

  text-align: center;

  padding: 10px;

  margin: auto;

  max-width: 100vw;

  overflow-x: hidden;
}
  
    h1 {
      margin-bottom: 20px;
    }

    #calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  width: 100%;
}

.colors {

  width: 100%;

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 12px;

  margin-top: 40px;

  margin-bottom: 30px;

  flex-wrap: wrap;
}

.color-button {

  width: 36px;

  height: 36px;

  border-radius: 50%;

  border: 1px solid #ccc;

  cursor: pointer;

  flex-shrink: 0;
}

    .weekdays {

  grid-template-columns: repeat(7, 1fr);

  text-align: center;

.weekdays div {

    .color1 { background: #ffe5e5; }
    .color2 { background: #ffb3b3; }
    .color3 { background: #ff8080; }
    .color4 { background: #ff4d4d; }
    .color5 { background: #ff1a1a; }

    .header {
   display: flex;
   justify-content: center;
   align-items: center;
   gap: 20px;
   margin-bottom: 20px;
  }

.header button {
  padding: 10px 15px;
  font-size: 18px;
  cursor: pointer;
}

.day {
  position: relative;
  border: 1px solid #ccc;
  border-radius: 10px;
  background: white;
  aspect-ratio: 1 / 1;
  overflow: hidden;
}

.dateText {
  font-size: 14px;
  z-index: 1;
}

.sticker {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, 20%);
}

#styleSelector {

  position: fixed;
  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  background: white;

  overflow-y: auto;

  padding: 24px;
  box-sizing: border-box;

  z-index: 999;
}

.lineStyle .day {
  border-radius: 0;
}

.roundStyle .day {
  border-radius: 10px;
}

.cornerStyle .day {
  border-left: 2px solid #ccc;
  border-bottom: 2px solid #ccc;
  border-top: none;
  border-right: none;
}

.styleOption {

  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 8px;

  cursor: pointer;
}

.styleOption img {

  width: 120px;
  border: 1px solid #ccc;
  border-radius: 10px;
}

#styleSelector {

  position: fixed;
  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  background: white;

  display: flex;
  flex-direction: column;

  justify-content: center;
  align-items: center;

  padding: 20px;
  box-sizing: border-box;

  z-index: 999;
}


#styleOptions {

  display: flex;

  align-items: center;

#styleSelector p {

  font-size: 15px;

  font-size: 20px;

  border: 1px solid #ccc;

  font-size: 15px;

  </style>
</head>

<body>

  <div class="header">
  <button onclick="changeMonth(-1)">←</button>

  <h1 id="monthTitle"></h1>

  <button onclick="changeMonth(1)">→</button>
</div>

<div class="weekdays">
  <div>日</div>
  <div>月</div>
  <div>火</div>
  <div>水</div>
  <div>木</div>
  <div>金</div>
  <div>土</div>
</div>

  <div class="calendar" id="calendar"></div>

  <div class="colors">

  <button class="color-button"
    style="background:#ffe5e5"
    onclick="selectColor('#ffe5e5',5)">
  </button>

  <button class="color-button"
    style="background:#ffb3b3"
    onclick="selectColor('#ffb3b3',4)">
  </button>

  <button class="color-button"
    style="background:#ff8080"
    onclick="selectColor('#ff8080',3)">
  </button>

  <button class="color-button"
    style="background:#ff4d4d"
    onclick="selectColor('#ff4d4d',2)">
  </button>

  <button class="color-button"
    style="background:#ff1a1a"
    onclick="selectColor('#ff1a1a',1)">
  </button>

</div>

  <br><br>

<script>

const calendar = document.getElementById("calendar");
const monthTitle = document.getElementById("monthTitle");

let selectedColor = "#ffe5e5";
let selectedValue = 5;

function selectColor(color, value) {
  selectedColor = color;
  selectedValue = value;
}

const today = new Date();

let currentYear = today.getFullYear();
let currentMonth = today.getMonth();

function getMonthKey(year, month) {
  return `${year}-${month}`;
}

function applyCalendarStyle(style) {

  document.body.classList.remove(
    "lineStyle",
    "roundStyle",
    "cornerStyle"
  );

  if (style === "line") {
    document.body.classList.add("lineStyle");
  }

  if (style === "round") {
    document.body.classList.add("roundStyle");
  }

  if (style === "corner") {
    document.body.classList.add("cornerStyle");
  }
}

function renderCalendar() {
const savedStyle =
  localStorage.getItem("calendarStyle");

if (savedStyle) {

  document.getElementById(
    "styleSelector"
  ).style.display = "none";

  applyCalendarStyle(savedStyle);
}

  calendar.innerHTML = "";

  const monthKey =
    getMonthKey(currentYear, currentMonth);

  const savedData =
    JSON.parse(localStorage.getItem(monthKey)) || {};

  const daysInMonth =
    new Date(currentYear, currentMonth + 1, 0).getDate();

  const firstDay =
    new Date(currentYear, currentMonth, 1).getDay();

  monthTitle.innerText =
    `${currentYear}年 ${currentMonth + 1}月`;

  for (let i = 0; i < firstDay; i++) {
    calendar.appendChild(document.createElement("div"));
  }

  for (let i = 1; i <= daysInMonth; i++) {

    const day = document.createElement("div");
day.className = "day";

const dateText = document.createElement("div");

dateText.innerText = i;

dateText.style.position = "absolute";
dateText.style.top = "4px";
dateText.style.left = "6px";
dateText.style.zIndex = "1";

day.appendChild(dateText);

    if (savedData[String(i)]) {

     const sticker = document.createElement("div");

sticker.style.width = "22px";
sticker.style.height = "22px";
sticker.style.borderRadius = "50%";
sticker.style.backgroundColor =
  savedData[String(i)].color;

/* ★絶対安定配置 */
sticker.style.position = "absolute";
sticker.style.bottom = "6px";
sticker.style.left = "50%";
sticker.style.transform = "translateX(-50%)";
sticker.style.zIndex = "2";

day.appendChild(sticker);
    }

    day.onclick = () => {
      const targetDate = new Date();
targetDate.setDate(targetDate.getDate() - 1);

const isTargetDate =
  i === targetDate.getDate() &&
  currentMonth === targetDate.getMonth() &&
  currentYear === targetDate.getFullYear();

if (!isTargetDate) {
  alert("前日の日付だけ入力できます");
  return;
}

      if (savedData[String(i)]) {
        alert("この日はすでに記録済みです");
        return;
      }

      const sticker = document.createElement("div");

     sticker.style.width = "22px";
     sticker.style.height = "22px";
     sticker.style.borderRadius = "50%";
     sticker.style.backgroundColor =
      selectedColor;

      /* ★これが不足している */
     sticker.style.position = "absolute";
     sticker.style.bottom = "6px";
     sticker.style.left = "50%";
     sticker.style.transform = "translateX(-50%)";
     sticker.style.zIndex = "2";

      day.appendChild(sticker);

      savedData[String(i)] = {
        color: selectedColor,
        value: selectedValue
      };

      localStorage.setItem(
        monthKey,
        JSON.stringify(savedData)
      );
    };

    calendar.appendChild(day);
  }
}


function changeMonth(direction) {

  currentMonth += direction;

  if (currentMonth < 0) {
    currentMonth = 11;
    currentYear--;
  }

  if (currentMonth > 11) {
    currentMonth = 0;
    currentYear++;
  }

  renderCalendar();
}

function downloadCSV() {

  let csv = "日付,値\n";

  for (let key in localStorage) {

    if (!key.includes("-")) continue;

    const monthData =
      JSON.parse(localStorage.getItem(key));

    const [year, month] = key.split("-");

    for (let day in monthData) {

      const value =
        monthData[day].value;

      const date =
        `${year}-${Number(month)+1}-${day}`;

      csv += `${date},${value}\n`;
    }
  }

  const blob =
    new Blob([csv], { type: "text/csv" });

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download = "mood_data.csv";

  a.click();

  URL.revokeObjectURL(url);
}

function selectStyle(style) {

  localStorage.setItem(
    "calendarStyle",
    style
  );

  document.getElementById(
    "styleSelector"
  ).style.display = "none";

  applyCalendarStyle(style);
}


renderCalendar();

</script>
</body>
</html>
